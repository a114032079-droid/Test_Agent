<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 破冰成功！</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at 20% 20%, #ffe6fa, transparent 50%),
                  radial-gradient(circle at 80% 80%, #d8e5ff, transparent 50%),
                  radial-gradient(circle at 50% 50%, #fff2d9, transparent 60%),
                  #f5f7fb;
      padding: 20px;
    }

    /* 粉彩漸層卡片 */
    .card {
      width: 100%;
      max-width: 440px;
      padding: 48px 36px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 236, 240, 0.85), rgba(230, 240, 255, 0.85), rgba(240, 255, 245, 0.85));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(100, 110, 140, 0.12),
                  0 2px 6px rgba(255, 255, 255, 0.8) inset;
      border: 1px solid rgba(255, 255, 255, 0.7);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(100, 110, 140, 0.16),
                  0 2px 8px rgba(255, 255, 255, 0.9) inset;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* 精美發光按鈕 */
    .glow-btn {
      position: relative;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      color: #ffffff;
      background: linear-gradient(135deg, #a78bfa, #ec4899, #f59e0b);
      background-size: 200% 200%;
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.45),
                  0 6px 18px rgba(167, 139, 250, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      outline: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .glow-btn:hover {
      background-position: right center;
      transform: scale(1.04);
      box-shadow: 0 0 32px rgba(236, 72, 153, 0.65),
                  0 8px 24px rgba(167, 139, 250, 0.5);
    }

    .glow-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 16px rgba(236, 72, 153, 0.4);
    }

    /* 按鈕下方顯示區域 */
    .result-container {
      margin-top: 32px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .click-count {
      font-size: 14px;
      font-weight: 600;
      color: #6366f1;
      background: rgba(255, 255, 255, 0.7);
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .quote-box {
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      line-height: 1.6;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .quote-box.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">✨ WELCOME TO ANTIGRAVITY</div>
    <h1>Antigravity 破冰成功！</h1>
    <p class="subtitle">點擊下方按鈕，接收今天專屬的好運與靈感！</p>
    
    <button id="sparkBtn" class="glow-btn">
      <span>點我探索</span>
      <span>🚀</span>
    </button>

    <div class="result-container">
      <div id="clickCount" class="click-count" style="display: none;">已點擊 0 次</div>
      <div id="quoteBox" class="quote-box"></div>
    </div>
  </div>

  <script>
    const quotes = [
      "🌟 每一步都是前進的軌跡，繼續保持熱情！",
      "✨ 今天的努力，正在悄悄鋪成未來的驚喜！",
      "🚀 相信過程，宇宙會為你的堅持讓路！",
      "💫 每一次嘗試，都在讓你變得更加強大！",
      "🌈 保持好奇心，世界比想像中更加精彩！",
      "🌸 你比自己想像的還要更有潛力與力量！",
      "🪐 小小的進展，也是極了不起的成就！",
      "🔮 靈感與好運正加速奔向你的路上！",
      "🔥 打破思維重力，飛向無限可能！",
      "☀️ 閃閃發光的你，值得所有的美好與喝采！"
    ];

    let count = 0;
    let lastIndex = -1;

    const btn = document.getElementById('sparkBtn');
    const countDisplay = document.getElementById('clickCount');
    const quoteBox = document.getElementById('quoteBox');

    btn.addEventListener('click', () => {
      count++;
      
      // 更新計數顯示
      countDisplay.style.display = 'inline-block';
      countDisplay.textContent = `已點擊 ${count} 次`;
      countDisplay.style.transform = 'scale(1.15)';
      setTimeout(() => {
        countDisplay.style.transform = 'scale(1)';
      }, 150);

      // 隨機選取不重複的鼓勵語
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * quotes.length);
      } while (quotes.length > 1 && nextIndex === lastIndex);
      lastIndex = nextIndex;

      // 文字淡入淡出動畫
      quoteBox.classList.remove('show');
      setTimeout(() => {
        quoteBox.textContent = quotes[nextIndex];
        quoteBox.classList.add('show');
      }, 100);
    });
  </script>
</body>
</html>
